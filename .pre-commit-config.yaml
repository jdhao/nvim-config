repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: ["--format=brief", ]
        pass_filenames: true
  - repo: local
    hooks:
      - id: stylua
        name: stylua-format-check
        entry: stylua --check .
        pass_filenames: false
        language: system
        types: [lua]
